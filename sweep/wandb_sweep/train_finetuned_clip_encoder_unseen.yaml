program: train_finetuned_clip_encoder.py
method: grid
metric:
  goal: minimize
  name: total/val_loss
parameters:
  game:
    values: ['all']
  overwrite:
    value: false
  saves_dir:
    value: '/mnt/nas/mgpcgrl/finetuned_clip_encoder'
  unseen_ratio:
    value: 0.0
  seen_ratio:
    value: 1.0
  seed:
    values: [0]
  n_epochs:
    value: 100
  batch_size:
    value: 256
  lr:
    value: 5.0e-6
  # unseen 게임 split (2글자 약어 — dg=dungeon, pk=pokemon, sk=sokoban, dm=doom, zd=zelda)
  # 총 30개 조합 (1+2+3+4 unseen games; C(5,1)+C(5,2)+C(5,3)+C(5,4) = 5+10+10+5 = 30)
  unseen_games:
    values:
      # 1 unseen game
      - 'pk'        # unseen: pokemon
      - 'dg'        # unseen: dungeon
      - 'zd'        # unseen: zelda
      - 'dm'        # unseen: doom
      - 'sk'        # unseen: sokoban
      # 2 unseen games
      - 'pkdg'      # unseen: pokemon, dungeon
      - 'pkzd'      # unseen: pokemon, zelda
      - 'pkdm'      # unseen: pokemon, doom
      - 'pksk'      # unseen: pokemon, sokoban
      - 'dgzd'      # unseen: dungeon, zelda
      - 'dgdm'      # unseen: dungeon, doom
      - 'dgsk'      # unseen: dungeon, sokoban
      - 'zddm'      # unseen: zelda, doom
      - 'zdsk'      # unseen: zelda, sokoban
      - 'dmsk'      # unseen: doom, sokoban
      # 3 unseen games
      - 'pkdgzd'    # unseen: pokemon, dungeon, zelda
      - 'pkdgdm'    # unseen: pokemon, dungeon, doom
      - 'pkdgsk'    # unseen: pokemon, dungeon, sokoban
      - 'pkzddm'    # unseen: pokemon, zelda, doom
      - 'pkzdsk'    # unseen: pokemon, zelda, sokoban
      - 'pkdmsk'    # unseen: pokemon, doom, sokoban
      - 'dgzddm'    # unseen: dungeon, zelda, doom
      - 'dgzdsk'    # unseen: dungeon, zelda, sokoban
      - 'dgdmsk'    # unseen: dungeon, doom, sokoban
      - 'zddmsk'    # unseen: zelda, doom, sokoban
      # 4 unseen games
      - 'pkdgzddm'  # unseen: pokemon, dungeon, zelda, doom
      - 'pkdgzdsk'  # unseen: pokemon, dungeon, zelda, sokoban
      - 'pkdgdmsk'  # unseen: pokemon, dungeon, doom, sokoban
      - 'pkzddmsk'  # unseen: pokemon, zelda, doom, sokoban
      - 'dgzddmsk'  # unseen: dungeon, zelda, doom, sokoban
command:
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}

