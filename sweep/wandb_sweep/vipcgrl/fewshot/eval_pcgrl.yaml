program: eval_vipcgrl.py
method: grid
metric:
  goal: minimize
  name: unseen/reg_unseen_overall
parameters:
  game:
    values: ['all']
  dataset_reward_enum:
    values: [0, 1, 2, 3, 4]
  seed:
    values: [0, 1, 2, 3, 4]
  reevaluate:
    value: true
  overwrite:
    value: false
  upload_h5:
    value: true
  encoder.ckpt_dir:
    value: '/mnt/nas/mgpcgrl/vipcgrl_fewshot'
  encoder.ckpt_name:
    values: [

      "clip-game-all_unseen-pk_ur-0.03_exp-def_0",
      "clip-game-all_unseen-dg_ur-0.03_exp-def_0",
      "clip-game-all_unseen-zd_ur-0.03_exp-def_0",
      "clip-game-all_unseen-dm_ur-0.03_exp-def_0",
      "clip-game-all_unseen-sk_ur-0.03_exp-def_0",
    ]
  saves_dir:
    value: '/mnt/nas/mgpcgrl/vipcgrl_fewshot'
command:
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
