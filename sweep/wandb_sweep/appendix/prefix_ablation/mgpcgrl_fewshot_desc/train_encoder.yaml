program: train_clip_decoder.py
project: aaai27_encoder_mgpcgrl_fewshot_desc
method: grid
metric:
  goal: minimize
  name: val/loss
parameters:
  game:
    value: 'all'
  overwrite:
    value: false
  instruction_prefix:
    value: 'desc'
  saves_dir:
    value: '/mnt/nas/mgpcgrl/mgpcgrl_fewshot_desc'
  unseen_ratio:
    value: 0.03
  unseen_games:
    values:
      - 'pk'
      - 'dg'
      - 'zd'
      - 'dm'
      - 'sk'
command:
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}

