# conf/train_clip_decoder.yaml
# CLIP Encoder + Reward Decoder training config
# Usage: python train_clip_decoder.py game=all

defaults:
  - train_clip_decoder_schema
  - _self_

encoder:
  model: cnnclip

# text config
decoder:
  hidden_dim: 128
  num_layers: 2
  num_reward_classes: 5
  cnn_reward_enum_onehot: true   # CNN text in  reward_enum one-hot text text