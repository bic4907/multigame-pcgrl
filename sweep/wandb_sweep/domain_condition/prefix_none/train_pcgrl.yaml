program: train_mgpcgrl.py
project: aaai27_train_mgpcgrl_fewshot_desc
method: grid
metric:
  goal: minimize
  name: unseen/reg_unseen_overall
parameters:
  game:
    value: 'all'
  dataset_reward_enum:
    values: [0, 1, 2, 3, 4]
  seed:
    values: [0]
  n_envs:
    value: 600
  overwrite:
    value: false
  instruction_prefix:
    value: 'desc'
  train_seen_ratio:
    value: 1.0
  encoder.ckpt_dir:
    value: '/mnt/nas/mgpcgrl/mgpcgrl_prefix_none'
  encoder.ckpt_name:
    values:
      - "clipdec-game-all_unseen-zddm_ur-0.1_exp-def_0"
      - "clipdec-game-all_unseen-zdsk_ur-0.1_exp-def_0"
      - "clipdec-game-all_unseen-dmsk_ur-0.1_exp-def_0"
      - "clipdec-game-all_unseen-pkzddm_ur-0.1_exp-def_0"
      - "clipdec-game-all_unseen-dgzddm_ur-0.1_exp-def_0"
      - "clipdec-game-all_unseen-zddmsk_ur-0.1_exp-def_0"
  saves_dir:
    value: '/mnt/nas/mgpcgrl/mgpcgrl_prefix_none'
command:
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
