program: train_ipcgrl.py
project: aaai27_train_ipcgrl_fewshot
method: grid
metric:
  goal: maximize
  name: unseen/mean_ep_return
parameters:
  game:
    value: 'all'
  dataset_reward_enum:
    values: [0, 1, 2, 3, 4]
  seed:
    values: [0, 1, 2, 3, 4]
  n_envs:
    value: 600
  overwrite:
    value: false
  encoder.ckpt_dir:
    value: '/mnt/nas/mgpcgrl/ipcgrl_fewshot'
  encoder.ckpt_name:
    values:
      - "ipcgrl-enc-mg-game-all_unseen-pk_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-dg_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-zd_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-dm_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-sk_ur-0.03_enc-mlp_exp-def_0"
  saves_dir:
    value: '/mnt/nas/mgpcgrl/ipcgrl_fewshot'
command:
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
