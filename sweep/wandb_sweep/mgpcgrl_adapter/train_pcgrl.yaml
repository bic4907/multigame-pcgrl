program: train_mgpcgrl.py
method: grid
metric:
  goal: minimize
  name: unseen/reg_unseen_overall
parameters:
  wandb_project:
    value: 'aaai27_train_mgpcgrl_adapter'
  game:
    values: ['all']
  dataset_reward_enum:
    values: [0, 1, 2, 3, 4]
  seed:
    values: [0]
  n_envs:
    value: 600
  overwrite:
    value: false
  train_seen_ratio:
    value: 1.0
  # ── adapter 비교: null(없음) / film / lora / moe ─────────────────────────────
  # exp_dir 는 get_exp_group() 에서 _adp-{type} suffix 자동 추가됨
  # adapter state는 encoder.ckpt_dir/{ckpt_name}_adp-{type}/adapter_state.pkl 에서 자동 로드
  decoder.adapter_type:
    values: [null, 'film', 'lora', 'moe']
  encoder.ckpt_dir:
    value: '/mnt/nas/mgpcgrl/mgpcgrl_adapter_encoder'
  encoder.ckpt_name:
    values: [
      "clipdec-game-all_unseen-zd_ur-0.03_exp-def_0",
      "clipdec-game-all_unseen-dm_ur-0.03_exp-def_0",
      "clipdec-game-all_unseen-sk_ur-0.03_exp-def_0",
      "clipdec-game-all_unseen-zddm_ur-0.03_exp-def_0",
      "clipdec-game-all_unseen-zdsk_ur-0.03_exp-def_0",
      "clipdec-game-all_unseen-dmsk_ur-0.03_exp-def_0",
      "clipdec-game-all_unseen-pkzddm_ur-0.03_exp-def_0",
      "clipdec-game-all_unseen-dgzddm_ur-0.03_exp-def_0",
      "clipdec-game-all_unseen-zddmsk_ur-0.03_exp-def_0",
      "clipdec-game-all_unseen-pkdgzddm_ur-0.03_exp-def_0",
      "clipdec-game-all_unseen-pkzddmsk_ur-0.03_exp-def_0",
      "clipdec-game-all_unseen-dgzddmsk_ur-0.03_exp-def_0",
    ]
  saves_dir:
    value: '/mnt/nas/mgpcgrl/mgpcgrl_adapter'
command:
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
# 전제: train_adapter.yaml sweep 완료 후 실행
# 총 runs: 4 adapter_types × 12 encoder_ckpts × 5 enums = 240 runs
