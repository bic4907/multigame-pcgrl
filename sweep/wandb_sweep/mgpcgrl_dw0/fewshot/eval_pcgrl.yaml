program: eval_mgpcgrl.py
project: aaai27_eval_mgpcgrl_fewshot
method: grid
metric:
  goal: minimize
  name: unseen/reg_unseen_overall
parameters:
  game:
    value: 'all'
  dataset_reward_enum:
    values: [0, 1, 2, 3, 4]
  seed:
    values: [0, 1, 2, 3, 4]
  reevaluate:
    value: true
  overwrite:
    value: false
  upload_h5:
    value: true
  train_seen_ratio:
    value: 1.0
  encoder.ckpt_dir:
    value: '/mnt/nas/mgpcgrl/mgpcgrl_fewshot_dw0'
  encoder.ckpt_name:
    values:
      - "clipdec-game-all_unseen-pk_ur-0.03_exp-def_0"
      - "clipdec-game-all_unseen-dg_ur-0.03_exp-def_0"
      - "clipdec-game-all_unseen-zd_ur-0.03_exp-def_0"
      - "clipdec-game-all_unseen-dm_ur-0.03_exp-def_0"
      - "clipdec-game-all_unseen-sk_ur-0.03_exp-def_0"
  saves_dir:
    value: '/mnt/nas/mgpcgrl/mgpcgrl_fewshot_dw0'
command:
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
