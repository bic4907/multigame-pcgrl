program: eval_vipcgrl.py
method: grid
metric:
  goal: minimize
  name: unseen/reg_unseen_overall
parameters:
  game:
    values: ['all']
  dataset_reward_enum:
    values: [0, 1, 2, 3, 4]
  reevaluate:
    value: true
  overwrite:
    value: true
  encoder.ckpt_dir:
    value: '/mnt/nas/mgpcgrl/vipcgrl_fewshot'
  encoder.ckpt_name:
    values: [
      # ── unseen_ratio: 0.1 ─────────────────────────────────────────────────
      # 1 unseen game
      "clip-game-all_unseen-zd_ur-0.1_exp-def_0",
      "clip-game-all_unseen-dm_ur-0.1_exp-def_0",
      "clip-game-all_unseen-sk_ur-0.1_exp-def_0",
      # 2 unseen games
      "clip-game-all_unseen-zddm_ur-0.1_exp-def_0",
      "clip-game-all_unseen-zdsk_ur-0.1_exp-def_0",
      "clip-game-all_unseen-dmsk_ur-0.1_exp-def_0",
      # 3 unseen games
      "clip-game-all_unseen-pkzddm_ur-0.1_exp-def_0",
      "clip-game-all_unseen-dgzddm_ur-0.1_exp-def_0",
      "clip-game-all_unseen-zddmsk_ur-0.1_exp-def_0",
      # 4 unseen games
      "clip-game-all_unseen-pkdgzddm_ur-0.1_exp-def_0",
      "clip-game-all_unseen-pkzddmsk_ur-0.1_exp-def_0",
      "clip-game-all_unseen-dgzddmsk_ur-0.1_exp-def_0",
    ]
  saves_dir:
    value: '/mnt/nas/mgpcgrl/vipcgrl_fewshot'
command:
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
# 총 runs: 12 encoder × 5 enum = 60 runs

