defaults:
  - finetuned_clip_pcgrl_schema
  - _self_

hydra:
  sweeper:
    params: {}

n_envs: 600

encoder:
  model: clip
  # Directory of the fine-tuned CLIP checkpoint (pretrained_encoders/<ckpt_name>/ckpts)
  # e.g. "finetuned-clip-game-all_exp-def_0", or give a full path via ckpt_path
  ckpt_dir: pretrained_encoders
  ckpt_name: null
  ckpt_path: null
  trainable: false

