program: train_vipcgrl.py
project: aaai27_train_vipcgrl_fullshot
method: grid
metric:
  goal: minimize
  name: unseen/reg_unseen_overall
parameters:
  game:
    values: ['all']
  dataset_reward_enum:
    values: [0, 1, 2, 3, 4]
  seed:
    values: [0, 1, 2]
  n_envs:
    value: 600
  overwrite:
    value: false
  encoder.ckpt_dir:
    value: '/mnt/nas/mgpcgrl/vipcgrl_fullshot'
  encoder.ckpt_name:
    values: [
      "clip-game-all_exp-def_0",
    ]
  saves_dir:
    value: '/mnt/nas/mgpcgrl/vipcgrl_fullshot'
command:
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
