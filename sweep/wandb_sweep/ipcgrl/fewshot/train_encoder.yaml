program: train_ipcgrl_encoder_mg.py
project: aaai27_encoder_ipcgrl_fewshot
method: grid
metric:
  goal: minimize
  name: val/mse_unseen_overall
parameters:
  game:
    value: 'all'
  overwrite:
    value: false
  saves_dir:
    value: '/mnt/nas/mgpcgrl/ipcgrl_fewshot'
  unseen_ratio:
    value: 0.03
  seen_ratio:
    value: 1.0
  seed:
    value: 0
  n_epochs:
    value: 100
  batch_size:
    value: 512
  lr:
    value: 0.001
  unseen_games:
    values:
      - 'pk'
      - 'dg'
      - 'zd'
      - 'dm'
      - 'sk'
command:
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
