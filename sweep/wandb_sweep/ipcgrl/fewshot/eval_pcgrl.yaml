program: eval_ipcgrl.py
project: aaai27_eval_ipcgrl_fewshot
method: grid
metric:
  goal: maximize
  name: unseen/mean_ep_return
parameters:
  game:
    value: 'all'
  dataset_reward_enum:
    values: [0, 1, 2, 3, 4]
  seed:
    values: [0, 1, 2]
  reevaluate:
    value: true
  overwrite:
    value: true
  encoder.ckpt_dir:
    value: '/mnt/nas/mgpcgrl/ipcgrl_encoder_fewshot'
  encoder.ckpt_name:
    values:
      # ── unseen_ratio: 0.03 ─────────────────────────────────────────────────
      - "ipcgrl-enc-mg-game-all_unseen-zd_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-dm_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-sk_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-zddm_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-zdsk_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-dmsk_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-pkzddm_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-dgzddm_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-zddmsk_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-pkdgzddm_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-pkzddmsk_ur-0.03_enc-mlp_exp-def_0"
      - "ipcgrl-enc-mg-game-all_unseen-dgzddmsk_ur-0.03_enc-mlp_exp-def_0"
  saves_dir:
    value: '/mnt/nas/mgpcgrl/ipcgrl_fewshot'
command:
  - ${interpreter}
  - ${program}
  - ${args_no_hyphens}
# 총 runs: 12 encoder × 5 enum × 5 seeds = 300 runs


